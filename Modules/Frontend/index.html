<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Human | Домашняя страница</title>
    <link rel="icon" href="https://img.icons8.com/color/48/instagram-verification-badge.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="light-theme d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <header class="d-flex justify-content-between align-items-center p-3 mb-4">
        <div class="d-flex gap-2">
            <img src="">
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
        </div>
        <div>
            
            <a class="btn btn-primary" href="login.html" role="button">Войти</a>
            <a class="btn btn-info" href="register.html" role="button">Зарегестрироваться</a>
            
        </div>
    </header>

    <main class="flex-grow-1 text-center">
        <div class="MetaHuman_label"><b><h1>Meta Human</h1></b></div>
        
    </main>

    <main class="flex-grow-1 text-left">
        <button type="button" id="uploadBtn" class="btn btn-success">Upload Images</button>
    </main>

    <footer class="p-3 text-center mt-auto">
        <p>&copy; 2026 Meta Human</p>
    </footer>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        uploadBtn.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            alert("Success!")
        });
    </script>
</body>

</html>
