<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Human | Домашняя страница</title>
    <link rel="icon" href="https://img.icons8.com/color/48/instagram-verification-badge.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="light-theme d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <header class="d-flex justify-content-between align-items-center p-3 mb-4">
        <div class="d-flex gap-2">
            <img src="">
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
            <a class="btn btn-dark theme-switch-btn" id="themeToggle" href="#" role="button"><svg id="themeToggleIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cloud-moon-fill" viewBox="0 0 16 16"><path d="M11.473 11a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5z"/><path d="M11.286 1.778a.5.5 0 0 0-.565-.755 4.595 4.595 0 0 0-3.18 5.003 5.5 5.5 0 0 1 1.055.209A3.6 3.6 0 0 1 9.83 2.617a4.593 4.593 0 0 0 4.31 5.744 3.58 3.58 0 0 1-2.241.634q.244.477.394 1a4.59 4.59 0 0 0 3.624-2.04.5.5 0 0 0-.565-.755 3.593 3.593 0 0 1-4.065-5.422z"/></svg></a>
        </div>

        <div>
            
            <a class="btn btn-primary" href="login.html" role="button">Войти</a>
            <a class="btn btn-info" href="register.html" role="button">Зарегестрироваться</a>
            
        </div>
        
        
    </header>

    <main class="flex-grow-1 text-center">
        <img class="main_logo" src="../../Common/Images/logo-white.svg">
        
    </main>

    <main class="flex-grow-1 text-left">
        <button type="button" id="uploadBtn" class="btn btn-success">Upload Images</button>
    </main>

    <footer class="p-3 text-center mt-auto">
        <p>&copy; 2026 Meta Human</p>
    </footer>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');

        uploadBtn.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function() {
            alert("Success!")
        });
    </script>
    <script src="theme_changer_script.js"></script>
</body>

</html>
