<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Human | Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="light-theme d-flex flex-column min-vh-100">
    <header class="d-flex justify-content-between align-items-center p-3">
        <div>
            <a class="btn btn-dark theme-switch-btn" href="index.html" role="button"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg> Назад</a>
        </div>
        <div>
            <a class="btn btn-dark theme-switch-btn" id="themeToggle" href="#" role="button"><svg id="themeToggleIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cloud-moon-fill" viewBox="0 0 16 16"><path d="M11.473 11a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5z"/><path d="M11.286 1.778a.5.5 0 0 0-.565-.755 4.595 4.595 0 0 0-3.18 5.003 5.5 5.5 0 0 1 1.055.209A3.6 3.6 0 0 1 9.83 2.617a4.593 4.593 0 0 0 4.31 5.744 3.58 3.58 0 0 1-2.241.634q.244.477.394 1a4.59 4.59 0 0 0 3.624-2.04.5.5 0 0 0-.565-.755 3.593 3.593 0 0 1-4.065-5.422z"/></svg></a>
        </div>
    </header>

    <main class="flex-grow-1">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="reg_form">
                        <div class="mb-3">
                            <label for="LoginFormControlInput" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="LoginFormControlInput" placeholder="ivanivanov@mail.ru">
                        </div>

                        <div class="mb-3">
                            <label for="LoginFormControlInput" class="form-label">Username</label>
                            <input type="username" class="form-control" id="LoginFormControlInput" placeholder="Ivan_Ivanov">
                        </div>
                        
                        <div class="mb-3">
                            <label for="inputPassword5" class="form-label">Password</label>
                            <input type="password" id="inputPassword5" class="form-control" placeholder="qwe12345678" aria-describedby="passwordHelpBlock">
                            Ваш пароль должен состоять из 8-20 символов, содержать буквы и цифры и не должен содержать пробелов, специальных символов.
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a class="btn btn-primary" href="#" role="button">Зарегистрироваться</a>
                            <a class="btn btn-link" href="login.html" role="button">У меня уже есть аккаунт.</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-3 text-center mt-auto">
        <p>&copy; 2026 Meta Human</p>
    </footer>

    <script src="theme_changer_script.js"></script>
</body>
</html>
